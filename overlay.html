html,body{margin:0;background:transparent;color:#fff;font:14px "Segoe UI",Arial,sans-serif;overflow:hidden}
#wrap{padding:10px}
#wrap svg{display:block;max-width:100%;height:auto}
.ov-head{overflow:hidden}
.ov-list{overflow:hidden;position:relative}
.ov-inner{transition:transform .35s ease-out;will-change:transform}
#status{position:fixed;left:10px;bottom:8px;font-size:12px;color:#d9c9f5;background:rgba(10,8,16,.7);padding:3px 8px;border-radius:6px}
#status.hide{display:none}
#done{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font:900 italic 64px "Arial Black",Arial;color:#fff;text-shadow:0 0 18px #c13cff,0 4px 0 #3b1366}
#done.on{display:flex}
</style>
